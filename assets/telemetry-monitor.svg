<svg width="100%" height="360" viewBox="0 0 950 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#080c13" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9E64" />
    </linearGradient>
    <linearGradient id="bar-ui" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="bar-db" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- HUD Frame -->
  <rect x="2" y="2" width="946" height="356" rx="14" fill="url(#hud-bg)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Top Status Bar -->
  <rect x="2" y="2" width="946" height="36" rx="14" fill="#111824" />
  <rect x="2" y="24" width="946" height="14" fill="#111824" />
  <line x1="2" y1="38" x2="948" y2="38" stroke="#1F2937" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="22" cy="19" r="5" fill="#EF4444" />
  <circle cx="38" cy="19" r="5" fill="#F59E0B" />
  <circle cx="54" cy="19" r="5" fill="#10B981" />

  <!-- Title & Status Pill -->
  <text x="475" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">
    MISSION CONTROL // REPOSITORY TELEMETRY &amp; HARDWARE INFERENCE PROFILER
  </text>
  
  <rect x="800" y="11" width="134" height="16" rx="8" fill="#1F2937" />
  <circle cx="812" cy="19" r="3.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="822" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" font-weight="700">STATUS: OPTIMAL</text>

  <!-- ==================== COLUMN 1: CODE ENGINE & COMPOSITION ==================== -->
  <g transform="translate(24, 56)">
    <!-- Subheader -->
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FE" letter-spacing="1">
      [01] CODEBASE COMPOSITION &amp; STACK
    </text>

    <!-- Metric 1: Python / Deep Learning -->
    <text x="0" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">Python (PyTorch, YOLO, FastAPI, OpenCV)</text>
    <text x="270" y="44" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF5722">94%</text>
    <rect x="0" y="52" width="270" height="8" rx="4" fill="#1F2937" />
    <rect x="0" y="52" width="254" height="8" rx="4" fill="url(#bar-py)">
      <animate attributeName="width" values="0;254" dur="1.2s" fill="freeze" />
    </rect>

    <!-- Metric 2: Full-Stack UI / JavaScript -->
    <text x="0" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">JavaScript &amp; Frontend (React, Vue, PyWebView)</text>
    <text x="270" y="86" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FE">82%</text>
    <rect x="0" y="94" width="270" height="8" rx="4" fill="#1F2937" />
    <rect x="0" y="94" width="221" height="8" rx="4" fill="url(#bar-ui)">
      <animate attributeName="width" values="0;221" dur="1.4s" fill="freeze" />
    </rect>

    <!-- Metric 3: Systems & Data -->
    <text x="0" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">Systems &amp; SQL (PostgreSQL, SQLite WAL, SSE)</text>
    <text x="270" y="128" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6">78%</text>
    <rect x="0" y="136" width="270" height="8" rx="4" fill="#1F2937" />
    <rect x="0" y="136" width="210" height="8" rx="4" fill="url(#bar-db)">
      <animate attributeName="width" values="0;210" dur="1.6s" fill="freeze" />
    </rect>

    <!-- Summary Box -->
    <rect x="0" y="160" width="270" height="110" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
    <text x="14" y="184" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#9CA3AF">ARCHITECTURAL DOMAINS:</text>
    <text x="14" y="206" font-family="system-ui, sans-serif" font-size="10.5" fill="#D1D5DB">• Neural Model Lifecycles (0 → 1)</text>
    <text x="14" y="226" font-family="system-ui, sans-serif" font-size="10.5" fill="#D1D5DB">• Multi-Camera Concurrent Ingestion</text>
    <text x="14" y="246" font-family="system-ui, sans-serif" font-size="10.5" fill="#D1D5DB">• Offline Desktop Silicon Runtimes</text>
  </g>

  <!-- Divider Line 1 -->
  <line x1="324" y1="56" x2="324" y2="336" stroke="#1F2937" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ==================== COLUMN 2: HARDWARE INFERENCE & EDGE OPS ==================== -->
  <g transform="translate(348, 56)">
    <!-- Subheader -->
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF5722" letter-spacing="1">
      [02] EDGE HARDWARE &amp; AI INFERENCE
    </text>

    <!-- Card 1 -->
    <rect x="0" y="32" width="260" height="66" rx="8" fill="#15121b" stroke="#FF5722" stroke-width="1" />
    <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FF5722">SILICON COMPILATION</text>
    <text x="14" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">TorchScript + Intel OpenVINO</text>
    <text x="14" y="86" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">Quantized for low-wattage edge runtimes</text>

    <!-- Card 2 -->
    <rect x="0" y="108" width="260" height="66" rx="8" fill="#131922" stroke="#00F2FE" stroke-width="1" />
    <text x="14" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00F2FE">CAMERA INGESTION CORE</text>
    <text x="14" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">USB 3.0 + RTSP + QR Handshake</text>
    <text x="14" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">Async thread-isolated frame decoders</text>

    <!-- Card 3 -->
    <rect x="0" y="184" width="260" height="86" rx="8" fill="#131e18" stroke="#10B981" stroke-width="1" />
    <text x="14" y="204" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#10B981">ACTIVE LEARNING FEEDBACK</text>
    <text x="14" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Automated Defect Triage Loop</text>
    <text x="14" y="238" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A7F3D0">• Edge false-detection capture pool</text>
    <text x="14" y="254" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A7F3D0">• ~20% accuracy uplift via retraining</text>
  </g>

  <!-- Divider Line 2 -->
  <line x1="638" y1="56" x2="638" y2="336" stroke="#1F2937" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ==================== COLUMN 3: AGILE & EXECUTIVE GOVERNANCE ==================== -->
  <g transform="translate(662, 56)">
    <!-- Subheader -->
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="1">
      [03] AGILE DELIVERY &amp; GOVERNANCE
    </text>

    <!-- Metric Card 1 -->
    <rect x="0" y="32" width="260" height="66" rx="8" fill="#161224" stroke="#8B5CF6" stroke-width="1" />
    <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#8B5CF6">ORGANIZATIONAL CAPACITY</text>
    <text x="14" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">150+ Direct Volunteers Led</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">Student Council Cultural President</text>

    <!-- Metric Card 2 -->
    <rect x="0" y="108" width="260" height="66" rx="8" fill="#1a1512" stroke="#F59E0B" stroke-width="1" />
    <text x="14" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">EVENT SCALE &amp; ATTENDANCE</text>
    <text x="14" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">6,000+ Participants Managed</text>
    <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">Anantam Festival across 3 editions</text>

    <!-- Metric Card 3 -->
    <rect x="0" y="184" width="260" height="86" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="204" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#D1D5DB">AGILE GOVERNANCE SCORE</text>
    <text x="14" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ 100% On-Time Program Delivery</text>
    <text x="14" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ 100% Under-Budget Fiscal Record</text>
    <text x="14" y="258" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">Google PM &amp; Atlassian Jira Certified</text>
  </g>
</svg>
