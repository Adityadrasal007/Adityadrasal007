<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top-left Circle Gradient (Orange -> Coral Red) -->
    <radialGradient id="grad-top" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A48" />
      <stop offset="60%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#D84315" />
    </radialGradient>

    <!-- Right Circle Gradient (Golden Yellow -> Amber Orange) -->
    <radialGradient id="grad-right" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFCA28" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#F57C00" />
    </radialGradient>

    <!-- Bottom-left Circle Gradient (Crimson -> Rose Red) -->
    <radialGradient id="grad-bottom" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="70%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#880E4F" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="1024" height="1024" rx="32" fill="#F5F3F0" />

  <!-- Circle Cluster -->
  <g style="mix-blend-mode: multiply;">
    <!-- Top-Left Circle -->
    <circle cx="445" cy="335" r="148" fill="url(#grad-top)" fill-opacity="0.92" />

    <!-- Bottom-Left Circle -->
    <circle cx="455" cy="470" r="130" fill="url(#grad-bottom)" fill-opacity="0.90" />

    <!-- Right Circle -->
    <circle cx="585" cy="400" r="152" fill="url(#grad-right)" fill-opacity="0.92" />
  </g>

  <!-- Wordmark "VISION FLOW" -->
  <text x="512" y="730" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif">
    <tspan font-size="76" font-weight="500" fill="#181B1D" letter-spacing="3">VISION </tspan>
    <tspan font-size="76" font-weight="800" fill="#181B1D" letter-spacing="3">FLOW</tspan>
  </text>

  <!-- Tagline "PEOPLE. IDEAS. PROGRESS." -->
  <text x="512" y="795" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#4B5156" letter-spacing="8">
    PEOPLE. IDEAS. PROGRESS.
  </text>
</svg>
