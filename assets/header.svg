<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#3B82F6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#3B82F6;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#fff" stroke-width="0.5">
      <animate attributeName="x1" values="0;1200" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="20s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Floating particles -->
  <circle cx="200" cy="80" r="1.5" fill="#3B82F6" opacity="0.4">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="200" r="1" fill="#8B5CF6" opacity="0.3">
    <animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="2" fill="#3B82F6" opacity="0.2">
    <animate attributeName="cy" values="50;35;50" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="100" r="1.5" fill="#8B5CF6" opacity="0.25">
    <animate attributeName="cy" values="100;85;100" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Decorative line -->
  <rect x="0" y="270" width="1200" height="1" fill="url(#line-grad)"/>
  
  <!-- Name -->
  <text x="100" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Aditya Rasal
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  
  <!-- Title with gradient -->
  <text x="100" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="url(#accent)" filter="url(#glow)" letter-spacing="0.5">
    AI Engineer · Computer Vision · Machine Learning
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>
  
  <!-- Tagline -->
  <text x="100" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="300" fill="#888888" letter-spacing="0.3">
    Building intelligent systems that see, understand, and act.
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>
  
  <!-- Location pill -->
  <rect x="100" y="235" rx="12" ry="12" width="140" height="24" fill="none" stroke="#333" stroke-width="0.5">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="120" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#666" letter-spacing="0.3">
    📍 Pune, India
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>
  
  <!-- Decorative geometric element (right side) -->
  <g transform="translate(950, 80)" opacity="0.15">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="none" stroke="url(#accent)" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="30s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="20" width="80" height="80" rx="15" fill="none" stroke="url(#accent)" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="360 60 60;0 60 60" dur="25s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

