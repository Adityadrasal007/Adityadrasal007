<svg width="100%" height="4" viewBox="0 0 1000 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#FF5722" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#FF5722;#8B5CF6;#00F2FE;#FF5722" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1">
        <animate attributeName="stop-color" values="#8B5CF6;#00F2FE;#FF5722;#8B5CF6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#00F2FE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F2FE;#FF5722;#8B5CF6;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="1" width="1000" height="2" rx="1" fill="url(#cyber-glow)" filter="url(#glow-blur)" />
</svg>
